services:
  db:
    container_name: db
    image: postgres:18.3-alpine
    restart: always
    env_file:
      - ./db/.env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    # --- Add Healthcheck Here ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_management"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    container_name: project-management
    build: ./project-management-service/
    restart: always
    env_file:
      - ./project-management-service/.env
    ports:
      - "8000:8000"
    # --- Update depends_on Here ---
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
